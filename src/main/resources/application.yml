spring:
  application:
    name: naverworks-clone-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Entity와 Flyway로 만든 실제 테이블 구조가 다른 경우 서버 시작을 막음.
      ddl-auto: validate
    # Controller 응답을 만드는 중에 지연 로딩 쿼리가 실행되는 것을 방지.
    open-in-view: false
  flyway:
    enabled: true
    # PostgreSQL 전용 인덱스는 운영 DB에서만 적용하고 H2 단위 테스트에서는 제외.
    locations: classpath:db/migration,classpath:db/migration-postgresql
  servlet:
    multipart:
      # 첨부 파일 하나 최대 20MB. 요청 전체는 다른 값(방 ID 등)을 위해 조금 여유를 둠.
      max-file-size: 20MB
      max-request-size: 21MB

server:
  # 로컬·배포 환경 모두 기본 9090을 사용하고 필요하면 환경 변수로 덮어씀.
  port: ${SERVER_PORT:9090}

app:
  redis:
    # true: 서버 여러 대가 Redis에 함께 기록(배포용). false: 이 서버 메모리에만 기록(로컬 개발용).
    # Redis 주소는 SPRING_DATA_REDIS_HOST·SPRING_DATA_REDIS_PORT·SPRING_DATA_REDIS_PASSWORD 환경 변수로 지정.
    enabled: ${REDIS_ENABLED:false}
  monitoring:
    # 대시보드의 서버 목록에 보일 이름. 비우면 컴퓨터 이름 + 임의 4글자.
    instance-id: ${APP_INSTANCE_ID:}
    # 대시보드의 "이번 시간·오늘·이번 주"를 자르는 기준 시간대.
    zone: ${APP_TIMEZONE:Asia/Seoul}
  storage:
    # 첨부 파일을 저장할 서버 디스크 폴더. 배포 때는 Docker 볼륨 경로로 덮어씀.
    root: ${FILE_STORAGE_ROOT:./uploads}
  cors:
    # Next.js 개발 서버만 API와 쿠키를 교차 출처로 호출하도록 허용.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  auth:
    issuer: ${JWT_ISSUER:naverworks-clone-api}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    # PT3H는 3시간, P1D는 1일(24시간)을 뜻하는 ISO-8601 시간 형식.
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT3H}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P1D}
    # HTTPS 운영 환경에서는 true로 설정해 쿠키를 암호화 연결에서만 전송.
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
